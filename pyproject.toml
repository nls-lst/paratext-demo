[project]
name = "paratext-demo"
version = "0.1.0"
requires-python = ">=3.11"
# The distribution is `paratext-cli`; the import package is `paratext`. Plain
# `paratext` on PyPI is an unrelated project.
# Needs >=0.2.1 for the `re-extract` config key used in paratext.toml.
dependencies = ["paratext-cli>=0.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bpl_cards"]

# The scaffolded audit test guards schema/prompt drift; `uv run pytest` needs it.
[dependency-groups]
dev = ["pytest>=8.0"]

[project.entry-points."paratext.projects"]
bpl-cards = "bpl_cards:PROJECT"
